name: Capture completed AM3352 routes

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SOLVER_SHA: "202b034659fb96bad44d11b8190f4044b675116f"
  PRODUCTION_SOLVER_SHA: "f37a130e83b2034fdfcf1bba5bafa88d8f73346c"
  BUN_JSC_forceRAMSize: "2147483648"
  BUN_JSC_miniVMHeapGrowthFactor: "1.05"

jobs:
  capture:
    name: Capture ${{ matrix.sample }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        sample: [control-inner1, outer-layers]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SOLVER_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_SOLVER_SHA }}
          path: head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install identical dependency manifests
        run: |
          for checkout in base head; do
            (cd "$checkout" && bun install --ignore-scripts)
          done
      - name: Fresh solve and retain only independently accepted copper
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir -p completed
          bun base/scripts/benchmark.ts --worker "$SAMPLE" --timeout-seconds 3600 \
            --solver head/lib/index.ts --routes-directory completed \
            > "completed/$SAMPLE.log" 2>&1
          bun --eval '
            import { createHash } from "node:crypto";
            import { cpus } from "node:os";
            const sample = process.env.SAMPLE;
            const file = Bun.file(`completed/${sample}.json`);
            const bytes = new Uint8Array(await file.arrayBuffer());
            const saved = JSON.parse(new TextDecoder().decode(bytes));
            if (!saved.solved || saved.failed || saved.error ||
                saved.traces.length !== saved.input.connections.length)
              throw Error("Refusing incomplete gallery copper");
            await Bun.write(`completed/${sample}.provenance.json`, JSON.stringify({
              sample, solverSha: process.env.PRODUCTION_SOLVER_SHA,
              controllerSha: process.env.BASE_SOLVER_SHA, runtime: Bun.version,
              timeoutSeconds: 3600, runnerName: process.env.RUNNER_NAME,
              cpu: cpus()[0].model, capturedAtUtc: new Date().toISOString(),
              inputSha256: createHash("sha256").update(JSON.stringify(saved.input)).digest("hex"),
              savedRouteSha256: createHash("sha256").update(bytes).digest("hex"),
              scope: "Fresh head-only capture using the unmodified base benchmark worker; not a paired performance measurement.",
            }, null, 2));
          '
      - name: Retain completed routes and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completed-gallery-${{ matrix.sample }}
          path: completed/
          if-no-files-found: error
          retention-days: 30
